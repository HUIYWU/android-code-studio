name: Build Android Code Studio

on:
  push:
    branches: 
      - "main" 
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: read

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      GPR_USER: ${{ secrets.TREE_SITTER_PACKAGES_USER || github.actor }}
      GPR_TOKEN: ${{ secrets.TREE_SITTER_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Extract Kotlin Analysis API engine
        shell: bash
        run: |
          archive="docs/misc/kotlin-android/analysis-api.tar.xz"
          destination="docs/misc/kotlin-android"
          jar="${destination}/analysis-api-standalone-embeddable-for-ide-2.3.255-SNAPSHOT.jar"
          tar -xJf "$archive" -C "$destination"
          echo "Extracted $jar"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Assemble Release APK
        run: ./gradlew :core:app:assembleRelease
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/release/*arm64-v8a*.apk
        if: always()