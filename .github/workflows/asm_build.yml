name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

permissions:
  contents: read
  packages: read

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      GPR_USER: ${{ secrets.TREE_SITTER_PACKAGES_USER || github.actor }}
      GPR_TOKEN: ${{ secrets.TREE_SITTER_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Extract Kotlin Analysis API engine
        shell: bash
        run: |
          archive="docs/misc/kotlin-android/analysis-api.tar.xz"
          destination="docs/misc/kotlin-android"
          jar="${destination}/analysis-api-standalone-embeddable-for-ide-2.3.255-SNAPSHOT.jar"
          test -f "$archive"
          tar -xJf "$archive" -C "$destination"
          test -f "$jar"
          echo "Extracted $jar"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=123456" >> local.properties  
          echo "signing.keyAlias=android-ide" >> local.properties
          echo "signing.keyPassword=123456" >> local.properties
      - name: Debug signing setup
        run: |
          echo "=== Repository structure ==="
          find . -name "*.jks" -o -name "local.properties" | head -10
          echo ""
          echo "=== local.properties content ==="
          cat local.properties || echo "local.properties not found"
          echo ""
          echo "=== SigningDirectory ==="
          ls -la core/app/signing/ || echo "core/app/signing directory not found"
      - name: Assemble Release APK
        run: ./gradlew :core:app:assembleRelease
      - name: List APK files (release)
        run: ls -la core/app/build/outputs/apk/release/
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/release/*arm64-v8a*.apk
        if: always()