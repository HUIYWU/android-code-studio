name: Publish Tooling Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish plugin and logsender
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publication version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Maven version: $version"
            exit 1
          fi
          echo "PUBLISH_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish plugin and logsender
        run: >-
          ./gradlew
          :tooling:plugin:publishPluginMavenPublicationToGitHubPackagesRepository
          :logging:logsender:publishReleasePublicationToGitHubPackagesRepository
          -PpublishVersion="$PUBLISH_VERSION"
